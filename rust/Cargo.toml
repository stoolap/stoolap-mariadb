[package]
name = "stoolap_mariadb"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "The MariaDB plugin's native interface to the stoolap engine"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
stoolap = { version = "0.5.0", default-features = false, features = ["parallel", "jemalloc"] }

rustc-hash = "1.1"
chrono = "0.4"
serde_json = "1.0"

[profile.release]
debug = 1
