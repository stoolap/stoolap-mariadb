name: Bench Drift

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

env:
  MARIADB_VERSION: '11.4'

jobs:
  bench-macos:
    name: Weekly bench drift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB ${{ env.MARIADB_VERSION }}
        run: |
          brew install mariadb@${{ env.MARIADB_VERSION }} cmake
          MARIADB_PREFIX="$(brew --prefix)/opt/mariadb@${{ env.MARIADB_VERSION }}"
          echo "MARIADB_PREFIX=$MARIADB_PREFIX" >> $GITHUB_ENV
          echo "$MARIADB_PREFIX/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
          key: bench-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            bench-rust-${{ runner.os }}-

      - name: Build plugin
        run: |
          cmake -S . -B build -DMariaDB_ROOT=$MARIADB_PREFIX
          cmake --build build -j

      - name: Set up Python
        # Pinned: mysql-connector-python fails to import on Python 3.15
        # (ssl.PROTOCOL_TLSv1 removed), which macos-latest now ships.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: python3 -m pip install --break-system-packages --user mysql-connector-python

      - name: Start test server
        run: KEEP_RUNNING=1 python3 tests/runner.py 14_scale

      - name: Check bench drift
        run: |
          python3 benchmarks/bench.py \
            --iterations 100 \
            --runs 3 \
            --check benchmarks/baseline.json \
            --mode warn

      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/stoolap-test.pid ]; then
            kill "$(cat /tmp/stoolap-test.pid)" || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-mariadbd-err
          path: /tmp/stoolap-test.err
          if-no-files-found: ignore
