name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARIADB_VERSION: '11.4'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # Pin to clang-format-18 (Ubuntu 24.04's default `clang-format`).
        # Different major versions disagree on edge cases (notably
        # multi-line macro backslash alignment), so the format gate
        # needs a fixed target. Local devs: install clang-format-18
        # via apt, brew install llvm@18, or `docker run ubuntu:24.04`.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: clang-format-18 --dry-run --Werror src/*.{cc,h}

  test-macos:
    name: Test on macOS (MariaDB 11.4)
    needs: format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB ${{ env.MARIADB_VERSION }}
        run: |
          brew install mariadb@${{ env.MARIADB_VERSION }} cmake
          MARIADB_PREFIX="$(brew --prefix)/opt/mariadb@${{ env.MARIADB_VERSION }}"
          echo "MARIADB_PREFIX=$MARIADB_PREFIX" >> $GITHUB_ENV
          echo "$MARIADB_PREFIX/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Follow stoolap main (nightly)
        # Cargo.lock pins the stoolap commit PRs build against; the
        # scheduled run moves it to main's head so upstream changes that
        # break the crate show up here first.
        if: github.event_name == 'schedule'
        run: cargo update --manifest-path rust/Cargo.toml -p stoolap

      - name: Build plugin
        run: |
          cmake -S . -B build -DMariaDB_ROOT=$MARIADB_PREFIX
          cmake --build build -j

      - name: Install plugin
        # The engine is linked into ha_stoolap.so (rust/).
        run: install -m 0755 build/ha_stoolap.so $MARIADB_PREFIX/lib/plugin/

      - name: Set up Python
        # Pinned: mysql-connector-python fails to import on Python 3.15
        # (ssl.PROTOCOL_TLSv1 removed), which macos-latest now ships.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: python3 -m pip install --break-system-packages --user mysql-connector-python

      - name: Run tests
        run: python3 tests/runner.py

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-mariadbd-err
          path: /tmp/stoolap-test.err
          if-no-files-found: ignore

  test-linux:
    name: Test on Ubuntu (MariaDB 11.4)
    needs: format
    # Pinned: ubuntu-latest moved to 26.04, which MariaDB's repo has no
    # 11.4 packages for.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MariaDB ${{ env.MARIADB_VERSION }} + dev headers
        run: |
          curl -LsS https://r.mariadb.com/downloads/mariadb_repo_setup \
            | sudo bash -s -- --mariadb-server-version=$MARIADB_VERSION --skip-maxscale --skip-tools
          sudo apt-get update
          sudo apt-get install -y mariadb-server libmariadbd-dev cmake g++ python3-pip
          sudo systemctl stop mariadb || true
          sudo systemctl disable mariadb || true
          echo "MARIADB_PREFIX=/usr" >> $GITHUB_ENV
          echo "MARIADBD_BIN=/usr/sbin/mariadbd" >> $GITHUB_ENV
          echo "MARIADB_BIN=/usr/bin/mariadb" >> $GITHUB_ENV
          echo "MARIADB_INSTALL_DB_BIN=/usr/bin/mariadb-install-db" >> $GITHUB_ENV
          if [ -d /usr/lib/mysql/plugin ]; then
            echo "MARIADB_PLUGIN_DIR=/usr/lib/mysql/plugin" >> $GITHUB_ENV
          else
            echo "MARIADB_PLUGIN_DIR=/usr/lib/mariadb/plugin" >> $GITHUB_ENV
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Follow stoolap main (nightly)
        # Cargo.lock pins the stoolap commit PRs build against; the
        # scheduled run moves it to main's head so upstream changes that
        # break the crate show up here first.
        if: github.event_name == 'schedule'
        run: cargo update --manifest-path rust/Cargo.toml -p stoolap

      - name: Build plugin
        run: |
          cmake -S . -B build -DMariaDB_ROOT=$MARIADB_PREFIX
          cmake --build build -j$(nproc)

      - name: Install plugin
        run: sudo install -m 0755 build/ha_stoolap.so $MARIADB_PLUGIN_DIR/

      - name: Set up Python
        # Pinned: mysql-connector-python fails to import on Python 3.15
        # (ssl.PROTOCOL_TLSv1 removed), which macos-latest now ships.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: python3 -m pip install --user mysql-connector-python

      - name: Run tests
        run: python3 tests/runner.py

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mariadbd-err
          path: /tmp/stoolap-test.err
          if-no-files-found: ignore
